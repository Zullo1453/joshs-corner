<article class="note-card{% if selected_note and note.id == selected_note.id %} active{% endif %}" data-note-id="{{ note.id }}"><a class="note-card-link" data-sidebar-select href="{{ url_for('notes.index', note_id=note.id, q=query, favourites=1 if favourites_only else none) }}"{% if selected_note and note.id == selected_note.id %} aria-current="page"{% endif %}><span class="note-title">{{ note.title }}</span><span class="note-preview">{{ note.body|rich_preview(92) }}</span><span class="note-date">Edited {{ note.updated_at|local_note_datetime }}</span></a><form class="note-star-form" method="post" action="{{ url_for('notes.toggle_favourite', note_id=note.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="q" value="{{ query }}">{% if favourites_only %}<input type="hidden" name="favourites" value="1">{% endif %}<button class="note-star{% if note.is_favourite %} favourited{% endif %}" type="submit" aria-label="Favourite {{ note.title }}" aria-pressed="{{ 'true' if note.is_favourite else 'false' }}">{{ "★" if note.is_favourite else "☆" }}</button></form></article>
