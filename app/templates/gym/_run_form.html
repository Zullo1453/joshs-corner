{% from "gym/_exercise_macros.html" import csrf with context %}
<form method="post" class="exercise-run-form" action="{{ url_for('exercise.edit_run', run_id=editing.id) if editing else url_for('exercise.create_run') }}">
{{ csrf() }}
<label><span>Route</span><select name="route_id" data-route-picker><option value="">Choose a route</option>{% for route in routes %}<option value="{{ route.id }}" data-distance="{{ route.distance_km|run_distance if route.distance_km else '' }}"{% if draft.get('route_id', '')|string == route.id|string %} selected{% endif %}>{{ route.name }}{% if route.distance_km %} · {{ route.distance_km|run_distance }} km{% endif %}</option>{% endfor %}</select><small>Choosing a route fills its distance; adjust if needed.</small></label>
<label><span>Or a new route</span><input name="new_route" maxlength="160" value="{{ draft.get('new_route', '') }}" placeholder="e.g. Home 5K"><small>A new name takes priority. Its first run sets the route distance.</small></label>
<label><span>Date</span><input name="run_date" type="date" value="{{ draft.get('run_date', today.isoformat() if today else '') }}" required></label>
<label><span>Start time <small>optional</small></span><input name="run_time" type="time" value="{{ draft.get('run_time', '') }}"></label>
<label><span>Distance (km)</span><input name="distance_km" type="number" min="0.001" max="1000" step="0.001" inputmode="decimal" value="{{ draft.get('distance_km', '') }}" placeholder="6.42" required></label>
<label><span>Elapsed time</span><input name="duration" inputmode="text" value="{{ draft.get('duration', '') }}" placeholder="31:18 or 1:05:42" aria-describedby="run-duration-hint" required><small id="run-duration-hint">Minutes:seconds or hours:minutes:seconds</small></label>
<label class="exercise-wide"><span>Notes <small>optional</small></span><textarea name="run_notes" maxlength="10000" rows="3">{{ draft.get('run_notes', draft.get('notes', '')) }}</textarea></label>
<div class="exercise-wide exercise-actions"><button class="gym-button">{{ 'Save changes' if editing else 'Save run' }}</button><span class="exercise-hint">Average pace is calculated from distance and elapsed time.</span></div>
</form>
