{% macro header() %}<header class="upcoming-header"><a class="upcoming-home" href="{{ section_home_url }}" aria-label="Hub home" title="Hub home">⌂</a><div><p>Josh's Corner</p><h1>Upcoming</h1></div></header>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="upcoming-messages" aria-live="polite">{% for category, message in messages %}<p class="upcoming-message upcoming-message--{{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% endmacro %}
