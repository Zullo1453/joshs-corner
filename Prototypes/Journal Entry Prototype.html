<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Entry Prototype</title>

<style>
  @font-face {
    font-family: "EB Garamond";
    src: local("EB Garamond");
  }

  :root {
    --bg: #171215;
    --panel: #21191c;
    --panel-2: #2a2023;
    --text: #f1e8e2;
    --muted: #aa9690;
    --faint: #74635f;
    --amber: #c78b52;
    --amber-soft: rgba(199, 139, 82, 0.18);
    --burgundy: #6d3945;
    --border: #4a3539;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% 8%, rgba(109,57,69,0.18), transparent 28%),
      linear-gradient(180deg, #171215 0%, #130f12 100%);
    color: var(--text);
    font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    padding: 1.4rem 1.6rem 2rem;
  }

  a { color: inherit; }

  .shell {
    max-width: 1240px;
    margin: 0 auto;
  }

  .topbar {
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    align-items: center;
    margin-bottom: 1.35rem;
  }

  .icon-button {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(33,25,28,0.84);
    text-decoration: none;
    font-size: 1.2rem;
    box-shadow: 0 0 16px rgba(199,139,82,0.08);
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }

  .icon-button:hover {
    transform: translateY(-2px);
    border-color: var(--amber);
    box-shadow: 0 0 20px rgba(199,139,82,0.2);
  }

  .page-title {
    text-align: center;
  }

  .page-title h1 {
    margin: 0;
    font-size: clamp(2.1rem, 4vw, 3.1rem);
    font-weight: 400;
    letter-spacing: 0.035em;
  }

  .page-title p {
    margin: 0.25rem 0 0;
    color: var(--muted);
    font-size: 1rem;
    font-style: italic;
  }

  .panel {
    border: 1px solid var(--border);
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(42,32,35,0.96), rgba(30,23,26,0.98));
    box-shadow:
      0 16px 42px rgba(0,0,0,0.28),
      inset 0 0 0 1px rgba(255,255,255,0.015);
  }

  .stitched {
    position: relative;
  }

  .stitched::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(199,139,82,0.18);
    border-radius: 12px;
    pointer-events: none;
  }

  button, input, textarea {
    font: inherit;
  }

  @media (max-width: 720px) {
    body {
      padding: 1rem;
    }

    .topbar {
      grid-template-columns: 44px 1fr 44px;
    }

    .page-title p {
      display: none;
    }
  }
</style>

<style>
  body {
    display: flex;
  }

  .shell {
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .entry-panel {
    flex: 1;
    min-height: 0;
    padding: 1.35rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
  }

  .entry-heading {
    text-align: center;
    padding: 0.4rem 1rem 1.25rem;
    border-bottom: 1px solid rgba(74,53,57,0.7);
  }

  .entry-heading .eyebrow {
    color: var(--amber);
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .entry-heading h2 {
    margin: 0.35rem 0 0;
    font-size: clamp(1.8rem, 3vw, 2.65rem);
    font-weight: 400;
  }

  .entry-heading p {
    margin: 0.3rem 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .writing-wrap {
    flex: 1;
    min-height: 0;
    padding: 1.5rem 1.4rem 1rem;
    display: flex;
  }

  .journal-text {
    width: 100%;
    min-height: 480px;
    resize: none;
    border: 0;
    outline: none;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2.25rem,
        rgba(199,139,82,0.09) 2.28rem
      );
    color: #eee4de;
    font-family: "EB Garamond", Garamond, serif;
    font-size: 1.22rem;
    line-height: 2.28rem;
    padding: 0 0.2rem;
    caret-color: var(--amber);
  }

  .journal-text::placeholder {
    color: #786765;
  }

  .entry-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(74,53,57,0.7);
  }

  .entry-meta {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .delete-button,
  .save-button {
    border-radius: 10px;
    cursor: pointer;
    transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .delete-button {
    padding: 0.7rem 0.9rem;
    border: 1px solid #5b363d;
    background: transparent;
    color: #a98288;
  }

  .save-button {
    padding: 0.72rem 1.2rem;
    border: 1px solid #8d5e38;
    background: linear-gradient(180deg, #9b673e, #75482f);
    color: #fff2e3;
    box-shadow: 0 0 18px rgba(199,139,82,0.18);
  }

  .delete-button:hover,
  .save-button:hover {
    transform: translateY(-1px);
  }

  .save-button:hover {
    box-shadow: 0 0 24px rgba(199,139,82,0.3);
  }

  @media (max-width: 700px) {
    .entry-panel {
      padding: 1rem;
    }

    .writing-wrap {
      padding: 1rem 0.4rem 0.7rem;
    }

    .journal-text {
      min-height: 420px;
      font-size: 1.1rem;
    }

    .entry-footer {
      align-items: flex-end;
    }

    .actions {
      flex-direction: column-reverse;
      align-items: stretch;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="icon-button" href="joshs_corner_journal_calendar_prototype.html" aria-label="Back to journal calendar">←</a>
      <div class="page-title">
        <h1>Journal</h1>
      </div>
      <a class="icon-button" href="joshs_corner_homepage_history_prototype_v4.html" aria-label="Back to homepage">⌂</a>
    </header>

    <section class="panel stitched entry-panel">
      <div class="entry-heading">
        <div class="eyebrow">Tuesday</div>
        <h2>28 July 2026</h2>
        <p>Saved journal entry</p>
      </div>

      <div class="writing-wrap">
        <textarea class="journal-text" spellcheck="true">The homepage finally feels like it belongs to me.

The purple glow is subtle enough that it does not feel overdone, and the spacing now feels properly balanced. I like that the whole thing is becoming a place rather than just a collection of tools.

Next is the journal. The calendar should feel calm and useful, and the entry page should feel like opening a real page rather than filling in a form.</textarea>
      </div>

      <div class="entry-footer">
        <div class="entry-meta">Last saved 8:42 pm</div>

        <div class="actions">
          <button class="delete-button">Delete entry</button>
          <button class="save-button">Save entry</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
