<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist Prototype</title>
<style>
  @font-face {
    font-family: "EB Garamond";
    src: local("EB Garamond");
  }

  :root {
    --bg: #0d0d18;
    --panel: #171725;
    --panel-2: #202039;
    --panel-3: #29264a;
    --text: #f7efff;
    --muted: #b6a8c7;
    --faint: #7f718f;
    --line: #4b3c66;
    --purple: #b16ee8;
    --purple-soft: rgba(177, 110, 232, 0.18);
    --pink: #ff73c8;
    --cyan: #67e7f2;
    --gold: #ddb36b;
    --danger: #b77d8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% -10%, rgba(255, 115, 200, 0.28), transparent 30%),
      radial-gradient(circle at 82% 12%, rgba(103, 231, 242, 0.12), transparent 28%),
      linear-gradient(180deg, #21102f 0%, #120e23 38%, #090b16 100%);
    color: var(--text);
    font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    padding: 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    left: -10vw;
    right: -10vw;
    bottom: -2vh;
    height: 48vh;
    pointer-events: none;
    background:
      linear-gradient(rgba(103,231,242,0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,115,200,0.22) 1px, transparent 1px);
    background-size: 44px 30px;
    transform: perspective(380px) rotateX(64deg);
    transform-origin: bottom;
    opacity: 0.42;
    mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.018) 0,
        rgba(255,255,255,0.018) 1px,
        transparent 1px,
        transparent 4px
      );
    opacity: 0.35;
    z-index: 0;
  }

  button, input, textarea, select {
    font: inherit;
  }

  .shell {
    max-width: 1340px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .topbar {
    display: flex;
    align-items: center;
    margin-bottom: 1rem;
  }

  .home-button {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: rgba(25, 26, 37, 0.9);
    color: var(--text);
    text-decoration: none;
    font-size: 1.2rem;
    transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .home-button:hover {
    transform: translateY(-2px);
    border-color: var(--purple);
    box-shadow: 0 0 18px rgba(154, 121, 207, 0.22);
  }

  .watch-app {
    position: relative;
    min-height: 770px;
    display: grid;
    grid-template-columns: 350px 1fr;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: var(--panel);
    box-shadow:
      0 18px 50px rgba(0, 0, 0, 0.36),
      0 0 24px rgba(177, 110, 232, 0.15),
      0 0 48px rgba(103, 231, 242, 0.06);
  }

  .watch-app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(
      135deg,
      rgba(255,115,200,0.55),
      rgba(177,110,232,0.18) 45%,
      rgba(103,231,242,0.45)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 2;
  }

  .library {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(28, 29, 42, 0.98), rgba(21, 22, 32, 0.99));
  }

  .library-head {
    padding: 1rem;
    border-bottom: 1px solid var(--line);
  }

  .new-item {
    width: 100%;
    padding: 0.78rem 1rem;
    border: 1px solid #765693;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b3ec1, #c148a8 55%, #3d8fa5);
    color: #f7edff;
    cursor: pointer;
    box-shadow:
      0 0 16px rgba(255,115,200,0.18),
      0 0 28px rgba(103,231,242,0.08);
    transition: transform 150ms ease, box-shadow 150ms ease;
  }

  .new-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(154, 121, 207, 0.2);
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 116px;
    gap: 0.55rem;
    margin-top: 0.8rem;
  }

  .filter-grid.secondary {
    grid-template-columns: 1fr 1fr;
    margin-top: 0.55rem;
  }

  .search,
  .filter-select {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #11121a;
    color: var(--text);
    outline: none;
  }

  .search {
    width: 100%;
    padding: 0.65rem 0.78rem;
  }

  .filter-select {
    padding: 0.55rem 0.65rem;
  }

  .search:focus,
  .filter-select:focus {
    border-color: var(--purple);
  }

  .watch-list {
    padding: 0.7rem;
    overflow-y: auto;
  }

  .watch-card {
    width: 100%;
    padding: 0.85rem 0.9rem;
    margin-bottom: 0.45rem;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }

  .watch-card:hover {
    background: rgba(255, 255, 255, 0.025);
  }

  .watch-card.active {
    background:
      linear-gradient(
        90deg,
        rgba(255,115,200,0.14),
        rgba(177,110,232,0.14),
        rgba(103,231,242,0.08)
      );
    border-color: rgba(255,115,200,0.5);
    box-shadow:
      inset 3px 0 0 var(--pink),
      0 0 18px rgba(177,110,232,0.12);
  }

  .watch-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .watch-name {
    color: #f3eff8;
    font-size: 1.08rem;
  }

  .mini-rating {
    color: var(--gold);
    font-size: 0.83rem;
    white-space: nowrap;
  }

  .watch-preview {
    margin-top: 0.28rem;
    color: var(--muted);
    font-size: 0.84rem;
    line-height: 1.3;
  }

  .watch-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.42rem;
    flex-wrap: wrap;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 23px;
    padding: 0.15rem 0.48rem;
    border-radius: 999px;
    font-size: 0.72rem;
  }

  .pill.type {
    border: 1px solid rgba(111, 197, 214, 0.35);
    color: #a6d9e2;
    background: rgba(111, 197, 214, 0.09);
  }

  .pill.status {
    border: 1px solid rgba(210, 120, 173, 0.28);
    color: #d5a4c1;
    background: rgba(210, 120, 173, 0.08);
  }

  .edited {
    color: var(--faint);
    font-size: 0.74rem;
  }

  .editor {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background:
      linear-gradient(180deg, rgba(28, 29, 42, 0.98), rgba(22, 23, 33, 0.99));
    position: relative;
  }

  .editor::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.012) 0,
        rgba(255, 255, 255, 0.012) 1px,
        transparent 1px,
        transparent 4px
      );
    opacity: 0.16;
  }

  .editor > * {
    position: relative;
    z-index: 1;
  }

  .editor-head {
    padding: 1.1rem 1.3rem 0.95rem;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(
        180deg,
        rgba(55,31,80,0.72),
        rgba(35,36,51,0.58)
      );
    box-shadow: inset 0 -1px 0 rgba(103,231,242,0.12);
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .watch-title-input {
    text-shadow:
      0 0 14px rgba(255,115,200,0.12),
      0 0 24px rgba(103,231,242,0.06);
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: "EB Garamond", Garamond, serif;
    font-size: clamp(1.8rem, 3vw, 2.55rem);
  }

  .save-state {
    color: var(--faint);
    font-size: 0.84rem;
    white-space: nowrap;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 150px 170px 190px 140px;
    gap: 0.75rem;
    align-items: end;
    margin-top: 1rem;
  }

  .field label {
    display: block;
    margin-bottom: 0.35rem;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .field select,
  .field input,
  .rating-control {
    width: 100%;
    min-height: 39px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #13141d;
    color: var(--text);
  }

  .field select,
  .field input {
    padding: 0.55rem 0.65rem;
    outline: none;
  }

  .field select:focus,
  .field input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(103,231,242,0.08);
  }

  .rating-control {
    display: flex;
    align-items: center;
    gap: 0.12rem;
    padding: 0.35rem 0.55rem;
  }

  .rating-star {
    position: relative;
    width: 1.22rem;
    height: 1.22rem;
    border: 0;
    background: transparent;
    color: #615d69;
    padding: 0;
    font-size: 1.12rem;
    line-height: 1;
    cursor: pointer;
    overflow: hidden;
  }

  .rating-star::before {
    content: "☆";
    position: absolute;
    inset: 0;
    color: #615d69;
  }

  .rating-star::after {
    content: "★";
    position: absolute;
    inset: 0;
    color: var(--gold);
    width: var(--fill, 0%);
    overflow: hidden;
    white-space: nowrap;
  }

  .rating-label {
    margin-left: 0.45rem;
    color: var(--muted);
    font-size: 0.83rem;
    white-space: nowrap;
  }

  .vhs-divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.75rem 1.3rem 0;
    color: var(--faint);
    font-size: 0.76rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .vhs-divider::before,
  .vhs-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(154, 121, 207, 0.4),
        rgba(111, 197, 214, 0.35),
        transparent
      );
  }

  .writing-area {
    flex: 1;
    min-height: 0;
    padding: 1rem 1.8rem 1.4rem;
  }

  .notes-body {
    width: 100%;
    height: 100%;
    min-height: 500px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: #ece9f1;
    font-family: "EB Garamond", Garamond, serif;
    font-size: 1.14rem;
    line-height: 1.8;
    caret-color: var(--cyan);
  }

  .notes-body::placeholder {
    color: #666171;
  }

  .editor-footer {
    padding: 0.85rem 1.3rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .footer-note {
    color: var(--faint);
    font-size: 0.84rem;
  }

  .footer-actions {
    display: flex;
    gap: 0.65rem;
  }

  .delete-button,
  .save-button {
    padding: 0.68rem 0.95rem;
    border-radius: 9px;
    cursor: pointer;
  }

  .delete-button {
    border: 1px solid #5c3c47;
    background: transparent;
    color: var(--danger);
  }

  .save-button {
    border: 1px solid #725589;
    background: linear-gradient(135deg, #7a3da0, #b34896);
    color: #f7efff;
    box-shadow: 0 0 15px rgba(154, 121, 207, 0.1);
  }

  @media (max-width: 980px) {
    .watch-app {
    position: relative;
      grid-template-columns: 290px 1fr;
    }

    .detail-row {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 720px) {
    body {
      padding: 0.8rem;
    }

    .watch-app {
    position: relative;
      grid-template-columns: 1fr;
      min-height: auto;
    }

    .watch-app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(
      135deg,
      rgba(255,115,200,0.55),
      rgba(177,110,232,0.18) 45%,
      rgba(103,231,242,0.45)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 2;
  }

  .library {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .watch-list {
      max-height: 250px;
    }

    .editor {
      min-height: 680px;
    }

    .detail-row {
      grid-template-columns: 1fr;
    }

    .writing-area {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }

    .editor-footer {
      align-items: flex-end;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="home-button" href="joshs_corner_homepage_history_prototype_v4.html" aria-label="Back to homepage">⌂</a>
    </header>

    <main class="watch-app">
      <aside class="library">
        <div class="library-head">
          <button class="new-item" id="new-item">＋ Add to Watchlist</button>

          <div class="filter-grid">
            <input class="search" id="search" type="search" placeholder="Search watchlist">
            <select class="filter-select" id="type-filter" aria-label="Filter by type">
              <option value="all">All types</option>
              <option value="Movie">Movie</option>
              <option value="Show">Show</option>
            </select>
          </div>

          <div class="filter-grid secondary">
            <select class="filter-select" id="status-filter" aria-label="Filter by status">
              <option value="all">All statuses</option>
              <option value="Want to Watch">Want to Watch</option>
              <option value="Watching">Watching</option>
              <option value="Finished">Finished</option>
            </select>

            <select class="filter-select" id="genre-filter" aria-label="Filter by genre">
              <option value="all">All genres</option>
              <option>Drama</option>
              <option>Sci-Fi</option>
              <option>Comedy</option>
              <option>Thriller</option>
              <option>Fantasy</option>
            </select>
          </div>
        </div>

        <div class="watch-list" id="watch-list">
          <button class="watch-card active" data-index="0" data-type="Movie" data-status="Finished" data-genre="Drama">
            <div class="watch-card-top">
              <div class="watch-name">The Godfather</div>
              <div class="mini-rating">★★★★★</div>
            </div>
            <div class="watch-preview">Patient, controlled and far more intimate than its reputation suggests…</div>
            <div class="watch-meta">
              <span class="pill type">Movie</span>
              <span class="pill status">Finished</span>
              <span class="edited">Edited today</span>
            </div>
          </button>

          <button class="watch-card" data-index="1" data-type="Show" data-status="Watching" data-genre="Sci-Fi">
            <div class="watch-card-top">
              <div class="watch-name">Severance</div>
              <div class="mini-rating">★★★★☆</div>
            </div>
            <div class="watch-preview">The office design is doing almost as much storytelling as the dialogue…</div>
            <div class="watch-meta">
              <span class="pill type">Show</span>
              <span class="pill status">Watching</span>
              <span class="edited">Edited 26 July</span>
            </div>
          </button>

          <button class="watch-card" data-index="2" data-type="Movie" data-status="Want to Watch" data-genre="Thriller">
            <div class="watch-card-top">
              <div class="watch-name">Memories of Murder</div>
              <div class="mini-rating">☆☆☆☆☆</div>
            </div>
            <div class="watch-preview">Recommended for the atmosphere, procedural detail and ending…</div>
            <div class="watch-meta">
              <span class="pill type">Movie</span>
              <span class="pill status">Want to Watch</span>
              <span class="edited">Added 22 July</span>
            </div>
          </button>

          <button class="watch-card" data-index="3" data-type="Show" data-status="Finished" data-genre="Comedy">
            <div class="watch-card-top">
              <div class="watch-name">The Office</div>
              <div class="mini-rating">★★★★½</div>
            </div>
            <div class="watch-preview">Comfort television that somehow improves once the characters become familiar…</div>
            <div class="watch-meta">
              <span class="pill type">Show</span>
              <span class="pill status">Finished</span>
              <span class="edited">Edited 10 July</span>
            </div>
          </button>

          <button class="watch-card" data-index="4" data-type="Movie" data-status="Want to Watch" data-genre="Fantasy">
            <div class="watch-card-top">
              <div class="watch-name">Pan's Labyrinth</div>
              <div class="mini-rating">☆☆☆☆☆</div>
            </div>
            <div class="watch-preview">Dark fantasy with a strong visual identity and historical setting…</div>
            <div class="watch-meta">
              <span class="pill type">Movie</span>
              <span class="pill status">Want to Watch</span>
              <span class="edited">Added 4 July</span>
            </div>
          </button>
        </div>
      </aside>

      <section class="editor">
        <div class="editor-head">
          <div class="title-row">
            <input class="watch-title-input" id="watch-title" value="The Godfather" aria-label="Title">
            <div class="save-state" id="save-state">Saved</div>
          </div>

          <div class="detail-row">
            <div class="field">
              <label for="watch-type">Type</label>
              <select id="watch-type">
                <option selected>Movie</option>
                <option>Show</option>
              </select>
            </div>

            <div class="field">
              <label for="watch-status">Status</label>
              <select id="watch-status">
                <option>Want to Watch</option>
                <option>Watching</option>
                <option selected>Finished</option>
              </select>
            </div>

            <div class="field">
              <label>Rating</label>
              <div class="rating-control" id="rating-control" aria-label="Rating">
                <button class="rating-star" type="button" data-star="1" aria-label="Rate 1 star"></button>
                <button class="rating-star" type="button" data-star="2" aria-label="Rate 2 stars"></button>
                <button class="rating-star" type="button" data-star="3" aria-label="Rate 3 stars"></button>
                <button class="rating-star" type="button" data-star="4" aria-label="Rate 4 stars"></button>
                <button class="rating-star" type="button" data-star="5" aria-label="Rate 5 stars"></button>
                <span class="rating-label" id="rating-label">5 / 5</span>
              </div>
            </div>

            <div class="field">
              <label for="release-year">Release year</label>
              <input id="release-year" type="number" min="1888" max="2100" value="1972">
            </div>
          </div>

          <div class="detail-row" style="grid-template-columns: 180px 1fr;">
            <div class="field">
              <label for="genre">Genre</label>
              <input id="genre" type="text" value="Drama" placeholder="e.g. Drama">
            </div>

            <div class="field">
              <label for="recommended-by">Recommended by / why added</label>
              <input id="recommended-by" type="text" value="Long-standing classic I had kept putting off">
            </div>
          </div>
        </div>

        <div class="vhs-divider">Playback notes · 198X archive</div>

        <div class="writing-area">
          <textarea class="notes-body" id="notes-body" spellcheck="true">The Godfather is much quieter than I expected.

Its reputation makes it sound like a film built around violence and intimidation, but most of its power comes from conversations, pauses and the way characters quietly test one another. Michael's transformation works because it happens gradually enough to feel inevitable rather than dramatic.

What stood out:
• The restaurant scene
• The contrast between the family wedding and the business being conducted inside
• How controlled the performances are
• The sense that every favour creates another obligation

It is long, but it rarely feels rushed or padded. The atmosphere carries almost as much weight as the plot.</textarea>
        </div>

        <div class="editor-footer">
          <div class="footer-note">Last edited today at 9:52 pm</div>
          <div class="footer-actions">
            <button class="delete-button" type="button">Delete item</button>
            <button class="save-button" type="button" id="save-button">Save item</button>
          </div>
        </div>
      </section>
    </main>
  </div>

<script>
  const examples = [
    {
      title: "The Godfather",
      type: "Movie",
      status: "Finished",
      rating: 5,
      year: 1972,
      genre: "Drama",
      recommended: "Long-standing classic I had kept putting off",
      body: `The Godfather is much quieter than I expected.

Its reputation makes it sound like a film built around violence and intimidation, but most of its power comes from conversations, pauses and the way characters quietly test one another. Michael's transformation works because it happens gradually enough to feel inevitable rather than dramatic.

What stood out:
• The restaurant scene
• The contrast between the family wedding and the business being conducted inside
• How controlled the performances are
• The sense that every favour creates another obligation

It is long, but it rarely feels rushed or padded. The atmosphere carries almost as much weight as the plot.`
    },
    {
      title: "Severance",
      type: "Show",
      status: "Watching",
      rating: 4,
      year: 2022,
      genre: "Sci-Fi",
      recommended: "Recommended for the production design and mystery",
      body: `The strongest part so far is how much unease comes from the environment itself.

The office is too clean, too empty and too carefully controlled. Even before the story reveals anything, the space already feels wrong.`
    },
    {
      title: "Memories of Murder",
      type: "Movie",
      status: "Want to Watch",
      rating: 0,
      year: 2003,
      genre: "Thriller",
      recommended: "Recommended for atmosphere, procedural detail and the ending",
      body: `Why I added it:

• Strong reputation as a crime film
• Directed by Bong Joon-ho
• Supposedly balances dark humour with a bleak investigation
• Often mentioned as one of the best films of the 2000s`
    },
    {
      title: "The Office",
      type: "Show",
      status: "Finished",
      rating: 4.5,
      year: 2005,
      genre: "Comedy",
      recommended: "A comfort rewatch",
      body: `The Office works best once the characters stop feeling like broad types and start feeling familiar.

The awkwardness is still the hook, but the reason it becomes rewatchable is the warmth underneath it.`
    },
    {
      title: "Pan's Labyrinth",
      type: "Movie",
      status: "Want to Watch",
      rating: 0,
      year: 2006,
      genre: "Fantasy",
      recommended: "Dark fantasy with a historical setting",
      body: `Why I added it:

• Distinctive creature design
• Dark fairy-tale tone
• Historical setting
• Frequently recommended for its visual storytelling`
    }
  ];

  const cards = document.querySelectorAll(".watch-card");
  const titleInput = document.getElementById("watch-title");
  const typeInput = document.getElementById("watch-type");
  const statusInput = document.getElementById("watch-status");
  const yearInput = document.getElementById("release-year");
  const genreInput = document.getElementById("genre");
  const recommendedInput = document.getElementById("recommended-by");
  const bodyInput = document.getElementById("notes-body");
  const saveState = document.getElementById("save-state");
  const ratingStars = [...document.querySelectorAll(".rating-star")];
  const ratingLabel = document.getElementById("rating-label");
  const newItemButton = document.getElementById("new-item");
  const saveButton = document.getElementById("save-button");
  const searchInput = document.getElementById("search");
  const typeFilter = document.getElementById("type-filter");
  const statusFilter = document.getElementById("status-filter");
  const genreFilter = document.getElementById("genre-filter");

  let currentRating = 5;

  function setRating(value) {
    currentRating = Math.max(0, Math.min(5, value));

    ratingStars.forEach((star, index) => {
      const starNumber = index + 1;
      let fill = 0;

      if (currentRating >= starNumber) {
        fill = 100;
      } else if (currentRating >= starNumber - 0.5) {
        fill = 50;
      }

      star.style.setProperty("--fill", `${fill}%`);
    });

    ratingLabel.textContent = currentRating ? `${currentRating} / 5` : "Not rated";
  }

  function openItem(index) {
    const item = examples[index];
    titleInput.value = item.title;
    typeInput.value = item.type;
    statusInput.value = item.status;
    yearInput.value = item.year;
    genreInput.value = item.genre;
    recommendedInput.value = item.recommended;
    bodyInput.value = item.body;
    setRating(item.rating);
    saveState.textContent = "Saved";
  }

  cards.forEach((card, index) => {
    card.addEventListener("click", () => {
      cards.forEach(item => item.classList.remove("active"));
      card.classList.add("active");
      openItem(index);
    });
  });

  ratingStars.forEach((star, index) => {
    star.addEventListener("click", event => {
      const rect = star.getBoundingClientRect();
      const clickedLeftHalf = event.clientX - rect.left < rect.width / 2;
      const value = index + (clickedLeftHalf ? 0.5 : 1);
      setRating(value);
      saveState.textContent = "Unsaved changes";
    });
  });

  [titleInput, typeInput, statusInput, yearInput, genreInput, recommendedInput, bodyInput]
    .forEach(control => {
      control.addEventListener("input", () => {
        saveState.textContent = "Unsaved changes";
      });
      control.addEventListener("change", () => {
        saveState.textContent = "Unsaved changes";
      });
    });

  newItemButton.addEventListener("click", () => {
    cards.forEach(item => item.classList.remove("active"));
    titleInput.value = "Untitled";
    typeInput.value = "Movie";
    statusInput.value = "Want to Watch";
    yearInput.value = "";
    genreInput.value = "";
    recommendedInput.value = "";
    bodyInput.value = "";
    bodyInput.placeholder = "Write why you added it, or your thoughts after watching…";
    setRating(0);
    saveState.textContent = "New item";
    titleInput.focus();
    titleInput.select();
  });

  saveButton.addEventListener("click", () => {
    saveState.textContent = "Saved";
  });

  function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedType = typeFilter.value;
    const selectedStatus = statusFilter.value;
    const selectedGenre = genreFilter.value;

    cards.forEach(card => {
      const name = card.querySelector(".watch-name").textContent.toLowerCase();
      const preview = card.querySelector(".watch-preview").textContent.toLowerCase();
      const type = card.dataset.type;
      const status = card.dataset.status;
      const genre = card.dataset.genre;

      const matchesSearch = !query || name.includes(query) || preview.includes(query);
      const matchesType = selectedType === "all" || type === selectedType;
      const matchesStatus = selectedStatus === "all" || status === selectedStatus;
      const matchesGenre = selectedGenre === "all" || genre === selectedGenre;

      card.style.display =
        matchesSearch && matchesType && matchesStatus && matchesGenre ? "" : "none";
    });
  }

  searchInput.addEventListener("input", applyFilters);
  typeFilter.addEventListener("change", applyFilters);
  statusFilter.addEventListener("change", applyFilters);
  genreFilter.addEventListener("change", applyFilters);

  setRating(5);
</script>
</body>
</html>
