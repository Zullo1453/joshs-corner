<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List Prototype</title>
<style>
  @font-face {
    font-family: "EB Garamond";
    src: local("EB Garamond");
  }

  :root {
    --bg: #17120f;
    --panel: #211914;
    --panel-2: #2a211a;
    --panel-3: #31261d;
    --text: #f3ece2;
    --muted: #b2a391;
    --faint: #7c6e60;
    --line: #4a3b30;
    --amber: #d59a54;
    --amber-soft: rgba(213, 154, 84, 0.14);
    --red: #8f4f43;
    --cream: #e9d7ba;
    --danger: #b57b73;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% 0%, rgba(171, 88, 56, 0.16), transparent 32%),
      radial-gradient(circle at 85% 12%, rgba(213, 154, 84, 0.09), transparent 25%),
      linear-gradient(180deg, #18110e 0%, #120d0b 100%);
    color: var(--text);
    font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    padding: 1.25rem;
  }

  button, input, textarea, select {
    font: inherit;
  }

  .shell {
    max-width: 1320px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    margin-bottom: 1rem;
  }

  .home-button {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: rgba(33, 25, 20, 0.9);
    color: var(--text);
    text-decoration: none;
    font-size: 1.2rem;
    transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .home-button:hover {
    transform: translateY(-2px);
    border-color: var(--amber);
    box-shadow: 0 0 18px rgba(213, 154, 84, 0.2);
  }

  .reading-app {
    min-height: 760px;
    display: grid;
    grid-template-columns: 345px 1fr;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: var(--panel);
    box-shadow:
      0 18px 50px rgba(0,0,0,0.32),
      0 0 34px rgba(213,154,84,0.06);
  }

  .library {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(39, 30, 24, 0.98), rgba(28, 21, 17, 0.99));
  }

  .library-head {
    padding: 1rem;
    border-bottom: 1px solid var(--line);
  }

  .new-book {
    width: 100%;
    padding: 0.78rem 1rem;
    border: 1px solid #7b5939;
    border-radius: 10px;
    background: linear-gradient(180deg, #694728, #4e351f);
    color: #fff3df;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(213,154,84,0.09);
    transition: transform 150ms ease, box-shadow 150ms ease;
  }

  .new-book:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(213,154,84,0.18);
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 118px;
    gap: 0.55rem;
    margin-top: 0.8rem;
  }

  .filter-grid.secondary {
    grid-template-columns: 1fr 1fr;
    margin-top: 0.55rem;
  }

  .search,
  .filter-select {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #17110e;
    color: var(--text);
    outline: none;
  }

  .search {
    width: 100%;
    padding: 0.65rem 0.78rem;
  }

  .filter-select {
    padding: 0.55rem 0.65rem;
  }

  .search:focus,
  .filter-select:focus {
    border-color: var(--amber);
  }

  .book-list {
    padding: 0.7rem;
    overflow-y: auto;
  }

  .book-card {
    width: 100%;
    padding: 0.85rem 0.9rem;
    margin-bottom: 0.45rem;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }

  .book-card:hover {
    background: rgba(255,255,255,0.025);
  }

  .book-card.active {
    background: var(--amber-soft);
    border-color: rgba(213,154,84,0.38);
  }

  .book-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .book-name {
    color: #f5efe5;
    font-size: 1.08rem;
  }

  .mini-rating {
    color: var(--amber);
    font-size: 0.83rem;
    white-space: nowrap;
  }

  .book-preview {
    margin-top: 0.28rem;
    color: var(--muted);
    font-size: 0.84rem;
    line-height: 1.3;
  }

  .book-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.42rem;
    flex-wrap: wrap;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 23px;
    padding: 0.15rem 0.48rem;
    border-radius: 999px;
    font-size: 0.72rem;
  }

  .pill.format {
    border: 1px solid rgba(213,154,84,0.32);
    color: #e4b87e;
    background: rgba(213,154,84,0.08);
  }

  .pill.status {
    border: 1px solid rgba(143,79,67,0.3);
    color: #d2a49a;
    background: rgba(143,79,67,0.08);
  }

  .edited {
    color: var(--faint);
    font-size: 0.74rem;
  }

  .editor {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background:
      linear-gradient(180deg, rgba(36, 28, 22, 0.98), rgba(29, 22, 18, 0.99));
  }

  .editor-head {
    padding: 1.1rem 1.3rem 0.95rem;
    border-bottom: 1px solid var(--line);
    background: rgba(48, 36, 28, 0.44);
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .book-title-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: "EB Garamond", Garamond, serif;
    font-size: clamp(1.8rem, 3vw, 2.55rem);
  }

  .save-state {
    color: var(--faint);
    font-size: 0.84rem;
    white-space: nowrap;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 170px 170px 170px 190px;
    gap: 0.75rem;
    align-items: end;
    margin-top: 1rem;
  }

  .field label {
    display: block;
    margin-bottom: 0.35rem;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .field select,
  .field input,
  .rating-control {
    width: 100%;
    min-height: 39px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #19120e;
    color: var(--text);
  }

  .field select,
  .field input {
    padding: 0.55rem 0.65rem;
    outline: none;
  }

  .field select:focus,
  .field input:focus {
    border-color: var(--amber);
  }

  .rating-control {
    display: flex;
    align-items: center;
    gap: 0.12rem;
    padding: 0.35rem 0.55rem;
  }

  .rating-star {
    position: relative;
    width: 1.22rem;
    height: 1.22rem;
    border: 0;
    background: transparent;
    color: #62584c;
    padding: 0;
    font-size: 1.12rem;
    line-height: 1;
    cursor: pointer;
    overflow: hidden;
  }

  .rating-star::before {
    content: "☆";
    position: absolute;
    inset: 0;
    color: #62584c;
  }

  .rating-star::after {
    content: "★";
    position: absolute;
    inset: 0;
    color: var(--amber);
    width: var(--fill, 0%);
    overflow: hidden;
    white-space: nowrap;
  }

  .rating-label {
    margin-left: 0.45rem;
    color: var(--muted);
    font-size: 0.83rem;
    white-space: nowrap;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.8rem 1.3rem 0;
    color: #9a7b5b;
    font-size: 0.76rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(213,154,84,0.38), transparent);
  }

  .writing-area {
    flex: 1;
    min-height: 0;
    padding: 1rem 1.8rem 1.4rem;
  }

  .notes-body {
    width: 100%;
    height: 100%;
    min-height: 500px;
    resize: none;
    border: 0;
    outline: none;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2rem,
        rgba(213,154,84,0.055) 2.04rem
      );
    color: #eee7dd;
    font-family: "EB Garamond", Garamond, serif;
    font-size: 1.14rem;
    line-height: 2.04rem;
    caret-color: var(--amber);
  }

  .notes-body::placeholder {
    color: #6a5d51;
  }

  .editor-footer {
    padding: 0.85rem 1.3rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .footer-note {
    color: var(--faint);
    font-size: 0.84rem;
  }

  .footer-actions {
    display: flex;
    gap: 0.65rem;
  }

  .delete-button,
  .save-button {
    padding: 0.68rem 0.95rem;
    border-radius: 9px;
    cursor: pointer;
  }

  .delete-button {
    border: 1px solid #5e4038;
    background: transparent;
    color: var(--danger);
  }

  .save-button {
    border: 1px solid #7b5939;
    background: linear-gradient(180deg, #694728, #4e351f);
    color: #fff3df;
    box-shadow: 0 0 15px rgba(213,154,84,0.09);
  }

  @media (max-width: 980px) {
    .reading-app {
      grid-template-columns: 290px 1fr;
    }

    .detail-row {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 720px) {
    body {
      padding: 0.8rem;
    }

    .reading-app {
      grid-template-columns: 1fr;
      min-height: auto;
    }

    .library {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .book-list {
      max-height: 250px;
    }

    .editor {
      min-height: 670px;
    }

    .detail-row {
      grid-template-columns: 1fr;
    }

    .writing-area {
      padding-left: 1.2rem;
      padding-right: 1.2rem;
    }

    .editor-footer {
      align-items: flex-end;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="home-button" href="joshs_corner_homepage_history_prototype_v4.html" aria-label="Back to homepage">⌂</a>
    </header>

    <main class="reading-app">
      <aside class="library">
        <div class="library-head">
          <button class="new-book" id="new-book">＋ Add Book</button>

          <div class="filter-grid">
            <input class="search" id="search" type="search" placeholder="Search reading list">
            <select class="filter-select" id="format-filter" aria-label="Filter by format">
              <option value="all">All formats</option>
              <option value="Written">Written</option>
              <option value="Audible">Audible</option>
            </select>
          </div>

          <div class="filter-grid secondary">
            <select class="filter-select" id="status-filter" aria-label="Filter by status">
              <option value="all">All statuses</option>
              <option value="To Read">To Read</option>
              <option value="Reading">Reading</option>
              <option value="Finished">Finished</option>
            </select>

            <select class="filter-select" id="rating-filter" aria-label="Filter by rating">
              <option value="all">All ratings</option>
              <option value="5">5 stars</option>
              <option value="4">4+ stars</option>
              <option value="3">3+ stars</option>
            </select>
          </div>
        </div>

        <div class="book-list" id="book-list">
          <button class="book-card active" data-index="0" data-format="Written" data-status="Finished" data-rating="4.5">
            <div class="book-card-top">
              <div class="book-name">Thinking, Fast and Slow</div>
              <div class="mini-rating">★★★★½</div>
            </div>
            <div class="book-preview">The difference between intuitive and deliberate thinking is the core lens…</div>
            <div class="book-meta">
              <span class="pill format">Written</span>
              <span class="pill status">Finished</span>
              <span class="edited">Edited today</span>
            </div>
          </button>

          <button class="book-card" data-index="1" data-format="Audible" data-status="Reading" data-rating="4">
            <div class="book-card-top">
              <div class="book-name">The Wager</div>
              <div class="mini-rating">★★★★☆</div>
            </div>
            <div class="book-preview">The early sections make the voyage feel increasingly doomed before the wreck…</div>
            <div class="book-meta">
              <span class="pill format">Audible</span>
              <span class="pill status">Reading</span>
              <span class="edited">Edited 26 July</span>
            </div>
          </button>

          <button class="book-card" data-index="2" data-format="Written" data-status="To Read" data-rating="0">
            <div class="book-card-top">
              <div class="book-name">The Silk Roads</div>
              <div class="mini-rating">☆☆☆☆☆</div>
            </div>
            <div class="book-preview">Added for a wider historical view that does not centre Europe…</div>
            <div class="book-meta">
              <span class="pill format">Written</span>
              <span class="pill status">To Read</span>
              <span class="edited">Added 19 July</span>
            </div>
          </button>

          <button class="book-card" data-index="3" data-format="Audible" data-status="Finished" data-rating="5">
            <div class="book-card-top">
              <div class="book-name">Project Hail Mary</div>
              <div class="mini-rating">★★★★★</div>
            </div>
            <div class="book-preview">A rare audiobook where the performance genuinely adds to the experience…</div>
            <div class="book-meta">
              <span class="pill format">Audible</span>
              <span class="pill status">Finished</span>
              <span class="edited">Edited 8 July</span>
            </div>
          </button>

          <button class="book-card" data-index="4" data-format="Written" data-status="To Read" data-rating="0">
            <div class="book-card-top">
              <div class="book-name">Meditations</div>
              <div class="mini-rating">☆☆☆☆☆</div>
            </div>
            <div class="book-preview">A short reflective book to read slowly rather than rush through…</div>
            <div class="book-meta">
              <span class="pill format">Written</span>
              <span class="pill status">To Read</span>
              <span class="edited">Added 1 July</span>
            </div>
          </button>
        </div>
      </aside>

      <section class="editor">
        <div class="editor-head">
          <div class="title-row">
            <input class="book-title-input" id="book-title" value="Thinking, Fast and Slow" aria-label="Book title">
            <div class="save-state" id="save-state">Saved</div>
          </div>

          <div class="detail-row">
            <div class="field">
              <label for="book-format">Format</label>
              <select id="book-format">
                <option selected>Written</option>
                <option>Audible</option>
              </select>
            </div>

            <div class="field">
              <label for="book-status">Status</label>
              <select id="book-status">
                <option>To Read</option>
                <option>Reading</option>
                <option selected>Finished</option>
              </select>
            </div>

            <div class="field">
              <label for="release-date">Release date</label>
              <input id="release-date" type="date" value="2011-10-25">
            </div>

            <div class="field">
              <label>Rating</label>
              <div class="rating-control" id="rating-control" aria-label="Book rating">
                <button class="rating-star" type="button" data-star="1" aria-label="Rate 1 star"></button>
                <button class="rating-star" type="button" data-star="2" aria-label="Rate 2 stars"></button>
                <button class="rating-star" type="button" data-star="3" aria-label="Rate 3 stars"></button>
                <button class="rating-star" type="button" data-star="4" aria-label="Rate 4 stars"></button>
                <button class="rating-star" type="button" data-star="5" aria-label="Rate 5 stars"></button>
                <span class="rating-label" id="rating-label">4.5 / 5</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider">Key learnings and notes</div>

        <div class="writing-area">
          <textarea class="notes-body" id="notes-body" spellcheck="true">The most useful idea is the distinction between two modes of thinking.

System 1
• Fast, intuitive and automatic
• Useful for everyday decisions
• Prone to shortcuts and predictable errors

System 2
• Slow, effortful and deliberate
• Better for complex reasoning
• Often lazy unless something forces it to engage

Key learning:
Confidence is not the same as accuracy. A coherent story can feel convincing even when it is based on incomplete evidence.

Things worth revisiting:
• Anchoring
• Availability bias
• Loss aversion
• The planning fallacy
• Base-rate neglect

The book is dense and repetitive in places, but the core concepts are genuinely useful for understanding decisions, judgement and behaviour.</textarea>
        </div>

        <div class="editor-footer">
          <div class="footer-note">Last edited today at 10:06 pm</div>
          <div class="footer-actions">
            <button class="delete-button" type="button">Delete book</button>
            <button class="save-button" type="button" id="save-button">Save book</button>
          </div>
        </div>
      </section>
    </main>
  </div>

<script>
  const examples = [
    {
      title: "Thinking, Fast and Slow",
      format: "Written",
      status: "Finished",
      releaseDate: "2011-10-25",
      rating: 4.5,
      body: `The most useful idea is the distinction between two modes of thinking.

System 1
• Fast, intuitive and automatic
• Useful for everyday decisions
• Prone to shortcuts and predictable errors

System 2
• Slow, effortful and deliberate
• Better for complex reasoning
• Often lazy unless something forces it to engage

Key learning:
Confidence is not the same as accuracy. A coherent story can feel convincing even when it is based on incomplete evidence.

Things worth revisiting:
• Anchoring
• Availability bias
• Loss aversion
• The planning fallacy
• Base-rate neglect

The book is dense and repetitive in places, but the core concepts are genuinely useful for understanding decisions, judgement and behaviour.`
    },
    {
      title: "The Wager",
      format: "Audible",
      status: "Reading",
      releaseDate: "2023-04-18",
      rating: 4,
      body: `The story works because the disaster unfolds gradually.

The voyage already feels compromised before the wreck, which makes every later decision feel like part of a chain rather than one isolated catastrophe.

Key points so far:
• Naval discipline under extreme pressure
• Leadership becomes harder when legitimacy breaks down
• Survival stories are also stories about who controls the final account`
    },
    {
      title: "The Silk Roads",
      format: "Written",
      status: "To Read",
      releaseDate: "2015-08-27",
      rating: 0,
      body: `Why I added it:

• A broader historical perspective
• Greater focus on trade, geography and exchange
• A useful counterweight to Europe-centred narratives`
    },
    {
      title: "Project Hail Mary",
      format: "Audible",
      status: "Finished",
      releaseDate: "2021-05-04",
      rating: 5,
      body: `The audiobook performance added a lot to the story.

Key learning:
The science works best when it creates problems and constraints rather than simply decorating the plot.

What stood out:
• The problem-solving structure
• The friendship at the centre of the story
• The balance between humour and high stakes`
    },
    {
      title: "Meditations",
      format: "Written",
      status: "To Read",
      releaseDate: "",
      rating: 0,
      body: `Read this slowly rather than treating it like a normal narrative book.

Aim:
Capture one useful reflection per reading session rather than trying to summarise the entire text.`
    }
  ];

  const cards = document.querySelectorAll(".book-card");
  const titleInput = document.getElementById("book-title");
  const formatInput = document.getElementById("book-format");
  const statusInput = document.getElementById("book-status");
  const releaseDateInput = document.getElementById("release-date");
  const bodyInput = document.getElementById("notes-body");
  const saveState = document.getElementById("save-state");
  const ratingStars = [...document.querySelectorAll(".rating-star")];
  const ratingLabel = document.getElementById("rating-label");
  const newBookButton = document.getElementById("new-book");
  const saveButton = document.getElementById("save-button");
  const searchInput = document.getElementById("search");
  const formatFilter = document.getElementById("format-filter");
  const statusFilter = document.getElementById("status-filter");
  const ratingFilter = document.getElementById("rating-filter");

  let currentRating = 4.5;

  function setRating(value) {
    currentRating = Math.max(0, Math.min(5, value));

    ratingStars.forEach((star, index) => {
      const starNumber = index + 1;
      let fill = 0;

      if (currentRating >= starNumber) {
        fill = 100;
      } else if (currentRating >= starNumber - 0.5) {
        fill = 50;
      }

      star.style.setProperty("--fill", `${fill}%`);
    });

    ratingLabel.textContent = currentRating ? `${currentRating} / 5` : "Not rated";
  }

  function openBook(index) {
    const book = examples[index];
    titleInput.value = book.title;
    formatInput.value = book.format;
    statusInput.value = book.status;
    releaseDateInput.value = book.releaseDate;
    bodyInput.value = book.body;
    setRating(book.rating);
    saveState.textContent = "Saved";
  }

  cards.forEach((card, index) => {
    card.addEventListener("click", () => {
      cards.forEach(item => item.classList.remove("active"));
      card.classList.add("active");
      openBook(index);
    });
  });

  ratingStars.forEach((star, index) => {
    star.addEventListener("click", event => {
      const rect = star.getBoundingClientRect();
      const clickedLeftHalf = event.clientX - rect.left < rect.width / 2;
      const value = index + (clickedLeftHalf ? 0.5 : 1);

      setRating(value);
      saveState.textContent = "Unsaved changes";
    });
  });

  [titleInput, formatInput, statusInput, releaseDateInput, bodyInput]
    .forEach(control => {
      control.addEventListener("input", () => {
        saveState.textContent = "Unsaved changes";
      });
      control.addEventListener("change", () => {
        saveState.textContent = "Unsaved changes";
      });
    });

  newBookButton.addEventListener("click", () => {
    cards.forEach(item => item.classList.remove("active"));
    titleInput.value = "Untitled book";
    formatInput.value = "Written";
    statusInput.value = "To Read";
    releaseDateInput.value = "";
    bodyInput.value = "";
    bodyInput.placeholder = "Write down key learnings, quotes or ideas worth revisiting…";
    setRating(0);
    saveState.textContent = "New book";
    titleInput.focus();
    titleInput.select();
  });

  saveButton.addEventListener("click", () => {
    saveState.textContent = "Saved";
  });

  function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedFormat = formatFilter.value;
    const selectedStatus = statusFilter.value;
    const selectedRating = ratingFilter.value;

    cards.forEach(card => {
      const name = card.querySelector(".book-name").textContent.toLowerCase();
      const preview = card.querySelector(".book-preview").textContent.toLowerCase();
      const format = card.dataset.format;
      const status = card.dataset.status;
      const rating = Number(card.dataset.rating);

      const matchesSearch = !query || name.includes(query) || preview.includes(query);
      const matchesFormat = selectedFormat === "all" || format === selectedFormat;
      const matchesStatus = selectedStatus === "all" || status === selectedStatus;
      const matchesRating =
        selectedRating === "all" || rating >= Number(selectedRating);

      card.style.display =
        matchesSearch && matchesFormat && matchesStatus && matchesRating ? "" : "none";
    });
  }

  searchInput.addEventListener("input", applyFilters);
  formatFilter.addEventListener("change", applyFilters);
  statusFilter.addEventListener("change", applyFilters);
  ratingFilter.addEventListener("change", applyFilters);

  setRating(4.5);
</script>
</body>
</html>
